spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://postgres:5432/userdb
    username: bikestore
    password: bikestore
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/hero-ecommerce

server:
  port: 8083

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG

