networks:
  bikestore-network:
    driver: bridge

services:

  # ─────────────────────────────────────────────────────────────
  # LAYER 1: Database — everything depends on this being healthy
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:14
    container_name: bike-postgres
    environment:
      POSTGRES_DB: bikestore
      POSTGRES_USER: bikestore
      POSTGRES_PASSWORD: bikestore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-multi-db.sql:/docker-entrypoint-initdb.d/init-multi-db.sql
    networks:
      - bikestore-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bikestore -d bikestore"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "True"
    ports:
      - "5050:80"
    networks:
      - bikestore-network

  # ─────────────────────────────────────────────────────────────
  # LAYER 1 (cont): RabbitMQ — Message broker
  # order-service publishes to it, notification-service consumes.
  # Management UI available at http://localhost:15672
  # Default credentials: guest / guest
  # ─────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"     # AMQP port — services connect here
      - "15672:15672"   # Management UI — browser dashboard
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - bikestore-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────────────────────
  # LAYER 2: Auth server + Service Registry
  # Both depend only on postgres. They start in parallel.
  # ─────────────────────────────────────────────────────────────
  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.4.6
    ports:
      - "9090:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloakdb
      KC_DB_USERNAME: bikestore
      KC_DB_PASSWORD: bikestore
    volumes:
      # Mount our custom theme so Keycloak can find it at startup
      - ./keycloak-themes/hero-theme:/opt/keycloak/themes/hero-theme
    command: ["start-dev"]
    networks:
      - bikestore-network
    restart: unless-stopped

  discovery-service:
    build: ../discovery-service
    container_name: discovery-service
    ports:
      - "8761:8761"
    networks:
      - bikestore-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

  # ─────────────────────────────────────────────────────────────
  # LAYER 2 (cont): Config Server
  # No DB needed — configs are bundled inside the JAR.
  # Must be healthy before any microservice starts.
  # ─────────────────────────────────────────────────────────────
  config-server:
    build: ../config-server
    container_name: config-server
    ports:
      - "8888:8888"
    networks:
      - bikestore-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

  # ─────────────────────────────────────────────────────────────
  # LAYER 3: Microservices
  # Wait for postgres + discovery-service + config-server
  # Config server must be healthy — services fetch config on startup
  # ─────────────────────────────────────────────────────────────
  bike-service:
    build: ../bike-service
    container_name: bike-service
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
    # No ports exposed — internal service, only reachable via gateway on port 7070
    networks:
      - bikestore-network
    restart: unless-stopped

  inventory-service:
    build: ../inventory-service
    container_name: inventory-service
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
    # No ports exposed — internal service, only reachable via gateway on port 7070
    networks:
      - bikestore-network
    restart: unless-stopped

  user-service:
    build: ../user-service
    container_name: user-service
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
    # No ports exposed — internal service, only reachable via gateway on port 7070
    networks:
      - bikestore-network
    restart: unless-stopped

  order-service:
    build: ../order-service
    container_name: order-service
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # No ports exposed — only reachable via gateway on port 7070
    networks:
      - bikestore-network
    restart: unless-stopped

  notification-service:
    build: ../notification-service
    container_name: notification-service
    depends_on:
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # No DB dependency — notification-service has no database
    ports:
      - "8085:8085"   # exposed for direct testing via localhost:8085
    networks:
      - bikestore-network
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # LAYER 4: API Gateway — starts last
  # ─────────────────────────────────────────────────────────────
  gateway-service:
    build: ../gateway-service
    container_name: gateway-service
    depends_on:
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
      bike-service:
        condition: service_started
      inventory-service:
        condition: service_started
      user-service:
        condition: service_started
      order-service:
        condition: service_started
    ports:
      - "7070:7070"
    networks:
      - bikestore-network
    restart: unless-stopped

volumes:
  postgres_data:
