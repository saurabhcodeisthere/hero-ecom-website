server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native          # native = serve configs from classpath/filesystem (no Git needed)
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config-repo   # configs live inside this JAR

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
