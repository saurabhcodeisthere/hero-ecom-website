# ─────────────────────────────────────────────────────────────────────────────
# USER SERVICE CONFIG
# ─────────────────────────────────────────────────────────────────────────────

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/userdb
    username: bikestore
    password: bikestore
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8080/realms/hero-ecommerce/protocol/openid-connect/certs

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
