networks:
  bikestore-network:
    driver: bridge

services:
  postgres:
    image: postgres:14
    container_name: bike-postgres
    environment:
      POSTGRES_DB: bikestore
      POSTGRES_USER: bikestore
      POSTGRES_PASSWORD: bikestore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-multi-db.sql:/docker-entrypoint-initdb.d/init-multi-db.sql
    networks:
      - bikestore-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bikestore -d bikestore"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin: # pgAdmin UI container to visually manage postgres
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy # ensure db starts first AND is healthy before pgadmin boots
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com    # login email for pgadmin UI
      PGADMIN_DEFAULT_PASSWORD: admin           # login password for pgadmin UI
      PGADMIN_CONFIG_SERVER_MODE: "True"        # run pgadmin in normal multi-user server mode
    ports:
      - "5050:80"             # expose pgadmin web console -> port 5050 on host
    networks:
      - bikestore-network                # so pgadmin can reach "db" using hostname inside docker network


  bike-service:
    build: ../bike-service
    container_name: bike-service
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bikestore
      SPRING_DATASOURCE_USERNAME: bikestore
      SPRING_DATASOURCE_PASSWORD: bikestore
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    networks:
      - bikestore-network
    restart: always

  inventory-service:
    build: ../inventory-service
    container_name: inventory-service
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      SPRING_APPLICATION_NAME: inventory-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bikestore
      SPRING_DATASOURCE_USERNAME: bikestore
      SPRING_DATASOURCE_PASSWORD: bikestore
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    networks:
      - bikestore-network
    restart: always

  user-service:
    build: ../user-service
    container_name: user-service
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      SPRING_APPLICATION_NAME: user-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/userdb
      SPRING_DATASOURCE_USERNAME: bikestore
      SPRING_DATASOURCE_PASSWORD: bikestore
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    networks:
      - bikestore-network
    restart: always

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.4.6
    ports:
      - "9090:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloakdb
      KC_DB_USERNAME: bikestore
      KC_DB_PASSWORD: bikestore
#      KC_HOSTNAME: local
#      KC_HOSTNAME_PORT: 8080
#      KC_HOSTNAME_STRICT: false
    #      KC_HEALTH_ENABLED: "true"         # <--- REQUIRED to enable /health endpoints
    #      KC_HTTP_ENABLED: "true"
    command: [ "start-dev" ]
    networks:
      - bikestore-network

volumes:
  postgres_data:
