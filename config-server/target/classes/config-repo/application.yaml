# ─────────────────────────────────────────────────────────────────────────────
# SHARED CONFIG — applied to ALL services automatically
# Put here anything that every service needs identically
# ─────────────────────────────────────────────────────────────────────────────

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
